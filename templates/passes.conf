# Graded benchmark passes. One line per pass, `cadre run` puts a candidate
# through all of them. Adding a pass = adding a line.
#
#   label | sha | checkout | base | keyfile
#
# checkout  the tree reviewers see. Relative to $CADRE_HOME, or absolute.
#           ★ Keep it history-truncated. `cadre make-pass` clones --depth 2
#           --single-branch: the fix commit's SUBJECT LINE gives the answer
#           away and every reviewer has git.
# base      what the target is diffed against. HEAD~1 for a truncated clone,
#           which has no origin/main ref.
# keyfile   relative to $CADRE_HOME, or absolute. ★ MUST live outside the
#           checkout or the candidate reads it. `cadre doctor` checks this.
#
# Severity comes from the key's item headings, so a new pass needs no code
# change. A heading that says BLOCKING makes that item blocking.
