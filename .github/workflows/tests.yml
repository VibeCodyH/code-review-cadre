name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq python3
      - name: Run tests
        run: bash test.sh
